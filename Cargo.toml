[package]
name = "messesinfo_scrapper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "messesinfo_scrapper"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
reqwest = { version = "0.12", default-features = true, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
